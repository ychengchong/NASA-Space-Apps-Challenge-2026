[project]
name = "trend-detective"
version = "0.1.0"
description = "Turns a plain-language question about the Earth into a tested trend, using NASA POWER data."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.6",
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "pydantic==2.14.3",
    "scipy==1.18.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pymannkendall==1.4.3",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
